[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# No sqlalchemy.url here on purpose: alembic/env.py resolves the URL from the
# app's own settings (DATABASE_URL / .env), so credentials are never duplicated.
# For a one-off run against another database, point DATABASE_URL at it (or pass
# an alternate config file with `-c`) instead of hard-coding credentials here.
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s